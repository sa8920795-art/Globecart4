<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 120px;
            padding: 20px;
        }

        h1 {
            font-size: 50px;
        }

        p {
            font-size: 22px;
            margin-top: 10px;
        }

        button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #c33764;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #dddddd;
        }

        footer {
            margin-top: 150px;
            padding: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome To My Website</h1>

        <p>This website is hosted for free using GitHub Pages.</p>

        <button onclick="showMessage()">Click Me</button>
    </div>

    <footer>
        Created by Me ❤️
    </footer>

    <script>
        function showMessage() {
            alert("Hello! Your website is working perfectly.");
        }
    </script>

</body>
  </html>
